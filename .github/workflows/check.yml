name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Build the site (fails on dead links)
        run: npm run build
      - name: Check that Chinese and English pages match
        run: python3 scripts/i18n.py
      - name: Warn when a page changed in one language only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/i18n.py --base "origin/$BASE_REF"
      - name: Scan tracked files for private identity and paths
        run: python3 scripts/privacy.py .
      - name: Checkout ModAVD for the shared privacy scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModAVD/ModAVD
          ref: main
          path: .modavd
          persist-credentials: false
          sparse-checkout: scripts/privacy.py
          sparse-checkout-cone-mode: false
      - name: scripts/privacy.py is ModAVD's
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s scripts/privacy.py .modavd/scripts/privacy.py; then
            echo "::error file=scripts/privacy.py::scripts/privacy.py differs from ModAVD/ModAVD main. The scanner is changed in ModAVD first; copy its scripts/privacy.py here byte for byte (only privacy-allowlist.json is this repository's own)."
            exit 1
          fi
          echo "scripts/privacy.py is the same as ModAVD/ModAVD main $(git -C .modavd rev-parse --short HEAD)"