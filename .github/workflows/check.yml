name: Check

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Build the site (fails on dead links)
        run: npm run build
      - name: Check that Chinese and English pages match
        run: python3 scripts/i18n.py
      - name: Warn when a page changed in one language only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/i18n.py --base "origin/$BASE_REF"
      - name: Scan tracked files for private identity and paths
        run: python3 scripts/privacy.py .
      - name: Checkout ModAVD for the shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModAVD/ModAVD
          ref: main
          path: .modavd
          persist-credentials: false
          sparse-checkout: |
            scripts/privacy.py
            scripts/repo_checks.py
            scripts/test_repo_checks.py
          sparse-checkout-cone-mode: false
      - name: Shared scripts are ModAVD's
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/privacy.py scripts/repo_checks.py scripts/test_repo_checks.py; do
            if ! cmp -s "$f" ".modavd/$f"; then
              echo "::error file=$f::$f differs from ModAVD/ModAVD main. These scripts are changed in ModAVD first; copy its $f here byte for byte (only privacy-allowlist.json is this repository's own)."
              exit 1
            fi
          done
          echo "privacy.py, repo_checks.py and test_repo_checks.py are the same as ModAVD/ModAVD main $(git -C .modavd rev-parse --short HEAD)"

  authors:
    name: Commit authors and trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Empty outside pull_request: the script then checks origin/main..HEAD.
      REPO_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      REPO_CHECK_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
    steps:
      - name: Checkout full history without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run repo checks unit tests
        run: python3 -B -I -X utf8 scripts/test_repo_checks.py -v
      # PR 里的提交在 pull_request 时已经查过。push 和 merge_group 下要查的只剩 GitHub 生成的 squash 提交，
      # 它的作者邮箱取自贡献者 GitHub 账号的设置，不归作者检查管；查了会让合并队列和 main 无端变红。
      - name: Check commit authors and trailers
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 -B -I -X utf8 scripts/repo_checks.py

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.32.0 (version and wheel hash pinned)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          printf '%s\n' 'zizmor==1.32.0 --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071' > "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor-requirements.txt"
      - name: Audit workflows and Dependabot config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --no-progress .'
